<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <style>
        /* Reset default margins and set up a modern background */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f4f7f6;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Create a clean, centered container card */
        .card {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 400px;
            text-align: center;
        }

        /* Style the main heading */
        h1 {
            color: #1a202c;
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 0.75rem;
        }

        /* Style the descriptive paragraph text */
        p {
            color: #4a5568;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        /* Turn the standard hyperlink into a beautiful button button */
        a {
            display: inline-block;
            background-color: #3182ce;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        /* Change the appearance slightly when the user hovers over the button */
        a:hover {
            background-color: #2b6cb0;
        }

        /* Add a quick tap/click visual indicator */
        a:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome to My Website</h1>
        <p>This is a paragraph of text on my new webpage.</p>

        <!-- This is a comment. It won't show up in the browser. -->
        <a href="https://wikipedia.org" target="_blank">Visit Wikipedia</a>
    </div>

</body>
</html>
